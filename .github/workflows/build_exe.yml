name: Build Standalone Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies & Playwright Browsers
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Compile Standalone Executable with PyInstaller
      shell: powershell
      run: |
        # Locate local Playwright browser installation
        $pwPath = "$env:LOCALAPPDATA\ms-playwright"
        
        # Build single-file executable embedding Playwright binaries into temp runtime
        pyinstaller --noconfirm --onefile --console `
          --add-data "$pwPath;playwright/driver/package/.local-browsers" `
          --name "GoogleChatAutomator" `
          browser_dm_automation.py

    - name: Upload Standalone Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoogleChatAutomator_SingleFile
        path: dist/GoogleChatAutomator.exe
